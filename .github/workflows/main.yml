name: Build FamiPlayer Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path . -Filter "*.zip" | Select-Object -First 1

          if (-not $zip) {
            Write-Error "Project ZIP not found"
          }

          Remove-Item -Path "project" -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath "project" -Force

      - name: Find Flutter project
        shell: powershell
        run: |
          $pubspec = Get-ChildItem `
            -Path "project" `
            -Filter "pubspec.yaml" `
            -Recurse |
            Select-Object -First 1

          if (-not $pubspec) {
            Write-Error "pubspec.yaml not found inside ZIP"
          }

          Write-Host "Flutter project found at:"
          Write-Host $pubspec.Directory.FullName

          "PROJECT_DIR=$($pubspec.Directory.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Fix media_kit Windows dependency
        shell: powershell
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $file = "pubspec.yaml"
          $content = Get-Content $file -Raw

          $content = $content -replace `
            'media_kit_libs_windows_video:\s*\^?1\.6\.0', `
            'media_kit_libs_windows_video: ^1.6.1'

          Set-Content $file $content -Encoding UTF8

          Write-Host "Updated pubspec.yaml"
          Get-Content $file

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build Windows
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build windows --release

      - name: Create ZIP
        shell: powershell
        run: |
          $release = "${{ env.PROJECT_DIR }}\build\windows\x64\runner\Release"

          if (-not (Test-Path $release)) {
            Write-Error "Windows Release folder not found"
          }

          Compress-Archive `
            -Path "$release\*" `
            -DestinationPath "FamiPlayer-Windows.zip" `
            -Force

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: FamiPlayer-Windows
          path: FamiPlayer-Windows.zip
